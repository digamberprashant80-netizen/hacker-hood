<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#030806">
  <meta name="description" content="HACKER HOOD — Digamber Prashant">
  <title>HACKER HOOD | Digamber Prashant</title>
  <style>
    :root { --green:#00ff66; --bg:#030806; --muted:#8ca99a; }
    * { box-sizing:border-box; }
    html,body { margin:0; min-height:100%; background:var(--bg); color:#f3fff7; }
    body {
      min-height:100vh; display:grid; place-items:center; overflow:hidden;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      background: radial-gradient(ellipse at 50% 48%, #092217 0%, #030806 58%, #010302 100%);
    }
    #matrix { position:fixed; inset:0; width:100%; height:100%; opacity:.28; z-index:0; }
    .scanlines { position:fixed; inset:0; z-index:1; pointer-events:none; opacity:.12;
      background:repeating-linear-gradient(to bottom, transparent 0 3px, rgba(0,255,102,.12) 4px); }
    main { position:relative; z-index:2; width:min(92vw,650px); padding:36px 22px; text-align:center; }
    .frame { position:relative; margin:0 auto 27px; width:min(66vw,290px); aspect-ratio:1;
      border:1px solid rgba(0,255,102,.55); border-radius:50%; display:grid; place-items:center;
      background:radial-gradient(circle,rgba(0,255,102,.12),rgba(0,0,0,.88) 68%);
      box-shadow:0 0 24px rgba(0,255,102,.18), inset 0 0 30px rgba(0,255,102,.08);
      animation:pulse 3s ease-in-out infinite; }
    .frame:before,.frame:after { content:""; position:absolute; inset:-9px; border:1px solid rgba(0,255,102,.18); border-radius:50%; }
    .frame:after { inset:-18px; border-style:dashed; opacity:.55; animation:spin 28s linear infinite; }
    .logo { width:78%; height:78%; filter:drop-shadow(0 0 12px rgba(0,255,102,.5)); }
    h1 { margin:0; color:var(--green); font-size:clamp(2.4rem,9vw,5rem); letter-spacing:.12em;
      text-shadow:0 0 8px rgba(0,255,102,.8),0 0 28px rgba(0,255,102,.35); }
    .name { margin:15px 0 0; font-size:clamp(1rem,4vw,1.55rem); letter-spacing:.19em; font-weight:700; }
    .tag { margin:18px 0 0; color:var(--muted); font-size:clamp(.65rem,2.5vw,.85rem); letter-spacing:.22em; }
    .status { display:inline-flex; align-items:center; gap:9px; margin-top:30px; color:var(--green);
      font-size:.72rem; letter-spacing:.16em; border:1px solid rgba(0,255,102,.28);
      border-radius:30px; padding:10px 15px; background:rgba(0,20,9,.55); }
    .dot { width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green); }
    footer { position:fixed; z-index:2; bottom:17px; left:0; right:0; text-align:center;
      color:#527260; font-size:.65rem; letter-spacing:.14em; }
    @keyframes pulse { 0%,100%{box-shadow:0 0 24px rgba(0,255,102,.18),inset 0 0 30px rgba(0,255,102,.08)} 50%{box-shadow:0 0 42px rgba(0,255,102,.3),inset 0 0 40px rgba(0,255,102,.13)} }
    @keyframes spin { to { transform:rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { *,*:before,*:after { animation:none!important; } }
  </style>
</head>
<body>
  <canvas id="matrix" aria-hidden="true"></canvas>
  <div class="scanlines" aria-hidden="true"></div>
  <main>
    <div class="frame" role="img" aria-label="Hooded hacker emblem">
      <svg class="logo" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <linearGradient id="hood" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#173d29"/><stop offset=".55" stop-color="#07150d"/><stop offset="1" stop-color="#020604"/>
          </linearGradient>
          <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#14251a"/><stop offset="1" stop-color="#030805"/>
          </linearGradient>
        </defs>
        <path d="M150 20C82 20 39 75 34 151l-13 92c-2 16 12 27 29 22l42-15c18 13 37 20 58 20s40-7 58-20l42 15c17 5 31-6 29-22l-13-92C261 75 218 20 150 20Z" fill="url(#hood)" stroke="#00ff66" stroke-width="4"/>
        <path d="M150 49c-48 0-78 42-80 99l-5 73c27 18 55 27 85 27s58-9 85-27l-5-73c-2-57-32-99-80-99Z" fill="url(#face)" stroke="#176c3b" stroke-width="3"/>
        <path d="M73 146c22-19 48-28 77-28s55 9 77 28l-12 34c-20-10-42-15-65-15s-45 5-65 15l-12-34Z" fill="#020604" stroke="#176c3b" stroke-width="2"/>
        <path d="M91 151l48 9-13 13-38-5Z" fill="#00ff66" opacity=".95"/>
        <path d="M209 151l-48 9 13 13 38-5Z" fill="#00ff66" opacity=".95"/>
        <path d="M143 203h14m-22 13h30" stroke="#176c3b" stroke-width="4" stroke-linecap="round"/>
        <path d="M52 90l-17 67m213-67 17 67M82 55l-12 20m148-20 12 20" stroke="#00ff66" stroke-width="3" opacity=".55" stroke-linecap="round"/>
        <path d="M39 247l47-18m175 18-47-18" stroke="#00ff66" stroke-width="3" opacity=".65"/>
      </svg>
    </div>
    <h1>HACKER HOOD</h1>
    <p class="name">DIGAMBER PRASHANT</p>
    <p class="tag">CYBER • CODE • TECHNOLOGY</p>
    <div class="status"><span class="dot"></span> SYSTEM ONLINE</div>
  </main>
  <footer>© 2026 HACKER HOOD</footer>
  <script>
    (() => {
      const canvas = document.getElementById('matrix');
      const ctx = canvas.getContext('2d');
      const chars = '01アイウエオカキクケコサシスセソ<>/{}[]';
      let drops = [], font = 15, columns = 0, width = 0, height = 0;
      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        width = window.innerWidth; height = window.innerHeight;
        canvas.width = width * dpr; canvas.height = height * dpr;
        canvas.style.width = width + 'px'; canvas.style.height = height + 'px';
        ctx.setTransform(dpr,0,0,dpr,0,0);
        columns = Math.ceil(width / font);
        drops = Array.from({length:columns}, () => Math.random() * -height / font);
      }
      function draw() {
        ctx.fillStyle = 'rgba(3,8,6,0.075)';
        ctx.fillRect(0,0,width,height);
        ctx.fillStyle = '#00ff66';
        ctx.font = font + 'px monospace';
        for (let i=0;i<drops.length;i++) {
          const char = chars[Math.floor(Math.random()*chars.length)];
          ctx.fillText(char, i*font, drops[i]*font);
          if (drops[i]*font > height && Math.random() > 0.975) drops[i] = 0;
          drops[i] += 0.55 + Math.random()*0.35;
        }
        requestAnimationFrame(draw);
      }
      window.addEventListener('resize', resize, {passive:true});
      resize(); draw();
    })();
  </script>
</body>
</html>
